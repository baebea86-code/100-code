<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="style.css">
    <title>Bea Writes</title>
</head>
<body>
    <header>
     <div>
      <span class="material-symbols-outlined">menu</span>
      <img src="./assets/logo.svg" alt="Bea Writes Logo" class="logo">
    </div>

    <div>
        <input type="search" placeholder="Search" id="search">
        <span id="search icon" class="material-symbols-outlined">search</span>
        <span id="voice search" class="material-symbols-outlined">mic</span>
    </div>
 
    <div>
          <button> + Create </button>
          <button id="theme-toggle" type="button" aria-label="Switch to light mode">
          <span class="material-symbols-outlined">light_mode</span>
          </button>
          <span class="material-symbols-outlined">notifications</span>
          <span class="material-symbols-outlined">account_circle</span>
    </div>
    </header>

</body>
</html>
